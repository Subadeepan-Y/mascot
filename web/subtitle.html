<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bones</title>
<style>
  /* Netflix style: bare text with hard drop shadow, no pill/box,
   * static 42px buddy face avatar. Perfectly centered with the screen. */
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #bar {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    padding: 4px 8px; max-width: 720px;
    font-size: 19px; font-weight: 600; line-height: 1.4;
    color: #f5f5f5; text-align: center; overflow-wrap: break-word;
    background: none; border: none; box-shadow: none;
    text-shadow:
      -1px -1px 0 rgba(0, 0, 0, 0.9),
      1px -1px 0 rgba(0, 0, 0, 0.9),
      -1px 1px 0 rgba(0, 0, 0, 0.9),
      1px 1px 0 rgba(0, 0, 0, 0.9),
      0 2px 6px rgba(0, 0, 0, 0.9);
    opacity: 1; transform: translateY(0);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #bar.enter { opacity: 0; transform: translateY(8px); }
  #bar.light {
    color: #141414;
    text-shadow:
      -1px -1px 0 rgba(255, 255, 255, 0.9),
      1px -1px 0 rgba(255, 255, 255, 0.9),
      -1px 1px 0 rgba(255, 255, 255, 0.9),
      1px 1px 0 rgba(255, 255, 255, 0.9),
      0 2px 6px rgba(255, 255, 255, 0.85);
  }
  #face {
    width: 42px; height: 42px; flex: none; border-radius: 50%;
    object-fit: cover; object-position: 50% 30%;
    border: 1px solid rgba(255, 255, 255, 0.18);
  }
  /* Symmetrical invisible spacer to balance the 42px avatar,
   * guaranteeing the subtitle text sits dead-center on the display. */
  .face-spacer {
    width: 42px; height: 42px; flex: none;
    visibility: hidden;
  }
  /* interruption emphasis: same system, stronger voice */
  #bar.alert { font-size: 21px; color: #ff7b7b; }
  #bar.light.alert { color: #c81e1e; }
  /* chase size: big film read from across the desk */
  #bar.game { font-size: 24px; font-weight: 600; }
</style>
</head>
<body>
<div id="bar" style="display:none">
  <img id="face" src="sprites/pet/face.png" alt="" />
  <span id="text"></span>
  <span id="face-spacer" class="face-spacer" aria-hidden="true"></span>
</div>
<script>
(() => {
  "use strict";
  const bar = document.getElementById("bar");
  const text = document.getElementById("text");
  const api = window.electron;
  async function tone() {
    try {
      const p = await api.getPos();
      const q = new URLSearchParams({ x: p.x, y: p.y, w: p.w, h: p.h });
      const t = await (await fetch(`http://127.0.0.1:17385/backdrop?${q}`)).json();
      bar.classList.toggle("light", !t.dark);
    } catch { /* keep current tone */ }
  }
  let toneTimer = 0;
  api.onWidgetMsg((m) => {
    if (!m || m.op === "hide") {
      bar.style.display = "none";
      clearInterval(toneTimer);
      return;
    }
    if (m.op === "show") {
      text.textContent = m.text || "";
      bar.classList.toggle("alert", !!m.alert);
      bar.classList.toggle("game", !!m.game);
      bar.classList.add("enter");
      bar.style.display = "inline-flex"; // explicit: never rely on the cascade here
      requestAnimationFrame(() => bar.classList.remove("enter"));
      tone();
      clearInterval(toneTimer);
      toneTimer = setInterval(tone, 3000);
    }
  });
})();
</script>
</body>
</html>
